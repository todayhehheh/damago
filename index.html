<!DOCTYPE html>
<html lang="ko" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="google" content="notranslate">
    <title>다마고치 퀘스트 (2단계: 이미지 적용)</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        /* --- [기본 스타일] --- */
        :root { --primary: #FF9F1C; --secondary: #2EC4B6; --bg: #F0F2F5; }
        
        * {
            box-sizing: border-box; margin: 0; padding: 0; font-family: 'Noto Sans KR', sans-serif;
            -webkit-user-select: none !important; user-select: none !important;
            -webkit-tap-highlight-color: transparent !important;
            touch-action: manipulation;
        }

        body { background: #ddd; display: flex; justify-content: center; height: 100vh; overflow: hidden; }
        
        .app-container {
            width: 100%; max-width: 420px; height: 100%; background: #F7F9FC;
            position: relative; display: flex; flex-direction: column;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
        }

        /* 헤더 */
        .app-header {
            height: 60px; padding: 0 20px; background: white; z-index: 10;
            display: flex; justify-content: space-between; align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .coin-display { background: #fff8e1; color: #f1c40f; padding: 5px 12px; border-radius: 20px; font-weight: bold; }

        /* 메인 콘텐츠 */
        #main-content { flex: 1; overflow-y: auto; padding: 20px; padding-bottom: 100px; }
        .hidden-section { display: none !important; }
        .active-section { display: block !important; animation: fadeIn 0.3s; }

        /* [수정됨] 펫 이미지 영역 */
        .pet-container { 
            text-align: center; margin: 30px 0; 
            height: 250px; /* 높이 고정 (이미지 바뀔 때 들썩거림 방지) */
            display: flex; flex-direction: column; justify-content: center; align-items: center;
        }
        
        /* 사용자가 넣을 이미지 스타일 */
        #pet-img {
            width: 200px;  /* 이미지 크기 */
            height: 200px;
            object-fit: contain; /* 비율 유지 */
            transition: transform 0.1s; /* 눌렀을 때 뿅! 효과 */
            cursor: pointer;
            filter: drop-shadow(0 10px 10px rgba(0,0,0,0.1)); /* 그림자 효과 */
        }
        #pet-img:active { transform: scale(0.95); }

        .speech-bubble {
            background: #333; color: white; padding: 10px 15px; border-radius: 15px;
            display: inline-block; position: relative; margin-bottom: 15px;
            animation: bounce 2s infinite;
        }
        .speech-bubble::after {
            content: ''; position: absolute; bottom: -8px; left: 50%; transform: translateX(-50%);
            border-width: 8px 8px 0; border-style: solid; border-color: #333 transparent transparent transparent;
        }

        /* 버튼 & 바 */
        .status-bars { background: white; padding: 20px; border-radius: 15px; margin-bottom: 20px; }
        .progress-bar-bg { background: #eee; height: 10px; border-radius: 5px; overflow: hidden; margin-top:5px; }
        .progress-bar { height: 100%; background: var(--secondary); width: 50%; transition: width 0.3s; }
        
        .interaction-menu { display: flex; gap: 10px; }
        .action-btn {
            flex: 1; background: white; border: none; padding: 15px; border-radius: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1); cursor: pointer; display: flex; flex-direction: column; align-items: center;
        }
        .action-btn i { font-size: 1.5rem; color: var(--primary); margin-bottom: 5px; }

        /* 하단 메뉴 */
        .bottom-nav {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
            width: 90%; max-width: 380px; height: 70px;
            background: rgba(255,255,255,0.95); border-radius: 35px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
            display: flex; justify-content: space-around; align-items: center; z-index: 999;
        }
        .nav-btn { background: none; border: none; color: #ccc; cursor: pointer; flex: 1; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .nav-btn.active { color: var(--secondary); font-weight: bold; }
        .nav-btn i { font-size: 1.4rem; margin-bottom: 3px; }

        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
        @keyframes fadeIn { from { opacity:0; } to { opacity:1; } }
    </style>
</head>
<body>

    <div class="app-container">
        <header class="app-header">
            <span id="user-nickname" style="font-weight:bold;">접속 중...</span>
            <span class="coin-display">💰 <span id="user-coins">0</span></span>
        </header>

        <main id="main-content">
            <section id="pet-section" class="active-section">
                <div class="pet-container">
                    <div class="speech-bubble" id="pet-speech">안녕! 난 너의 펫이야!</div>
                    
                    <img id="pet-img" src="images/pet_normal.png" 
                         onerror="this.src='https://via.placeholder.com/200?text=No+Image'" 
                         alt="펫 캐릭터">
                </div>

                <div class="status-bars">
                    <div>😋 배고픔 <div class="progress-bar-bg"><div class="progress-bar" id="bar-hunger"></div></div></div>
                    <div style="margin-top:10px;">✨ 청결도 <div class="progress-bar-bg"><div class="progress-bar" id="bar-clean"></div></div></div>
                    <div style="margin-top:10px;">😊 재미 <div class="progress-bar-bg"><div class="progress-bar" id="bar-fun"></div></div></div>
                </div>

                <div class="interaction-menu">
                    <button class="action-btn" onclick="app.action('feed')"><i class="fas fa-hamburger"></i>밥주기</button>
                    <button class="action-btn" onclick="app.action('clean')"><i class="fas fa-soap"></i>씻기기</button>
                    <button class="action-btn" onclick="app.action('play')"><i class="fas fa-gamepad"></i>놀기</button>
                </div>
            </section>

            <section id="quest-section" class="hidden-section">
                <h2>오늘의 퀘스트</h2>
                <div id="quest-list" style="margin-top:20px;">
                    <div style="background:white; padding:15px; border-radius:10px;">퀘스트 로딩 중...</div>
                </div>
            </section>
        </main>

        <nav class="bottom-nav">
            <button class="nav-btn active" onclick="app.switchTab('pet-section', this)"><i class="fas fa-home"></i>홈</button>
            <button class="nav-btn" onclick="app.switchTab('quest-section', this)"><i class="fas fa-list"></i>퀘스트</button>
        </nav>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, getDoc, setDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // 키값 유지
        const firebaseConfig = {
            apiKey: "AIzaSyDvT-74P4tT1q50HSrQaND_4U6wd8k1D-E",
            authDomain: "dama-ec569.firebaseapp.com",
            projectId: "dama-ec569",
            storageBucket: "dama-ec569.firebasestorage.app",
            messagingSenderId: "328651666527",
            appId: "1:328651666527:web:4cccf725a6ef061e2b97ea",
            measurementId: "G-XMVX5EZ1SL"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let currentUser = null;
        let userId = new URLSearchParams(window.location.search).get('id');
        if (!userId) userId = "test_user";

        // ★ 이미지 경로 설정 (파일명과 똑같아야 함!)
        const IMAGES = {
            normal: "images/pet_normal.png",
            eat:    "images/pet_eat.png",
            clean:  "images/pet_bath.png",
            play:   "images/pet_play.png"
        };

        // 중복 클릭 방지용 변수
        let isPetBusy = false; 

        window.app = {
            switchTab: (targetId, btn) => {
                document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                document.querySelectorAll('section').forEach(s => {
                    if(s.id === targetId) { s.classList.remove('hidden-section'); s.classList.add('active-section'); }
                    else { s.classList.add('hidden-section'); s.classList.remove('active-section'); }
                });
            },

            // ★ 행동 함수 (이미지 교체 로직 포함)
            action: async (type) => {
                if (!currentUser) return alert("로딩 중입니다!");
                if (isPetBusy) return; // 펫이 뭐 하고 있으면 클릭 무시

                if (currentUser.coins < 10) return alert("코인이 부족해요! (10원 필요)");

                // 1. 코인 차감 & 상태 변화
                currentUser.coins -= 10;
                let reactionImg = IMAGES.normal;
                let reactionText = "";

                if(type === 'feed') {
                    currentUser.pet.hunger = Math.min(100, currentUser.pet.hunger + 20);
                    reactionImg = IMAGES.eat; // 먹는 짤
                    reactionText = "냠냠! 맛있다!";
                }
                if(type === 'clean') {
                    currentUser.pet.cleanliness = Math.min(100, currentUser.pet.cleanliness + 20);
                    reactionImg = IMAGES.clean; // 씻는 짤
                    reactionText = "아이 개운해!";
                }
                if(type === 'play') {
                    currentUser.pet.fun = Math.min(100, currentUser.pet.fun + 20);
                    reactionImg = IMAGES.play; // 노는 짤
                    reactionText = "헤헤 재밌다!";
                }

                // 2. 화면 즉시 갱신 (이미지 바꿈!)
                isPetBusy = true; // "나 바쁨" 상태
                updateUI();
                
                const imgEl = document.getElementById('pet-img');
                const speechEl = document.getElementById('pet-speech');
                
                imgEl.src = reactionImg; // 이미지 교체
                speechEl.innerText = reactionText;

                // 3. 2초 뒤에 원래대로 복귀 (setTimeout)
                setTimeout(() => {
                    imgEl.src = IMAGES.normal;
                    speechEl.innerText = "심심해~";
                    isPetBusy = false; // "이제 안 바쁨"
                }, 2000); 

                // 4. DB 저장
                await updateDoc(doc(db, "users", userId), {
                    coins: currentUser.coins,
                    pet: currentUser.pet
                });
            }
        };

        async function init() {
            try {
                const userRef = doc(db, "users", userId);
                const snap = await getDoc(userRef);

                if (snap.exists()) {
                    currentUser = snap.data();
                } else {
                    currentUser = {
                        nickname: "모험가_" + userId,
                        coins: 100,
                        pet: { hunger: 50, cleanliness: 50, fun: 50, characterId: 'custom' }
                    };
                    await setDoc(userRef, currentUser);
                }
                updateUI();
                document.getElementById('quest-list').innerHTML = `
                    <div style="background:white; padding:15px; border-radius:10px;">
                        <h3>💧 물 마시기</h3>
                        <p style="color:#666; font-size:0.8rem;">보상: 30 코인</p>
                    </div>`;

            } catch (error) {
                console.error(error);
                document.getElementById('pet-speech').innerText = "오류 발생!";
            }
        }

        function updateUI() {
            document.getElementById('user-nickname').innerText = currentUser.nickname;
            document.getElementById('user-coins').innerText = currentUser.coins;
            
            document.getElementById('bar-hunger').style.width = currentUser.pet.hunger + "%";
            document.getElementById('bar-clean').style.width = currentUser.pet.cleanliness + "%";
            document.getElementById('bar-fun').style.width = currentUser.pet.fun + "%";
        }

        init();
    </script>
</body>
</html>
