<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>다마고치 퀘스트</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="loading-screen">
        <div class="spinner"></div>
        <p>데이터를 불러오고 있어요...</p>
    </div>

    <div id="tutorial-screen">
        <div class="tutorial-content">
            <h1>환영합니다! 🎉</h1>
            <p>나만의 펫을 키우며<br>목표를 달성해보세요.</p>
            <div class="pet-preview">🥚</div>
            <button class="btn-primary" onclick="app.startTutorial()">시작하기</button>
        </div>
    </div>

    <div class="app-container" id="app-container" style="display:none;">
        <header class="app-header">
            <span id="user-nickname" onclick="app.editName()">내 이름</span>
            <span class="coin-display">💰 <span id="user-coins">0</span></span>
        </header>

        <main id="main-content">
            <section id="pet-section" class="active-section">
                <div class="pet-container">
                    <div class="speech-bubble" id="pet-speech">안녕! 반가워!</div>
                    <img id="pet-img" src="images/pet_lv1.png" onerror="this.src='https://via.placeholder.com/200?text=PET'">
                </div>

                <div id="smart-shop-area">
                    <button id="btn-buy-egg" class="shop-btn egg-btn" onclick="app.gacha()">
                        🎲 알 받기 (30G)
                    </button>
                    <button id="btn-buy-stone" class="shop-btn stone-btn" onclick="app.buyStone()" style="display:none;">
                        💎 진화의 돌 구매 (200G)
                    </button>
                </div>

                <div class="level-info">
                    <span id="level-badge" style="background:#333; color:white; padding:3px 8px; border-radius:10px; font-size:0.8rem; margin-right:10px;">Lv.1</span>
                    <div class="exp-bar-bg"><div class="exp-bar" id="exp-bar"></div></div>
                </div>

                <div class="status-bars">
                    <div>😋 배고픔 <div class="progress-bar-bg"><div class="progress-bar" id="bar-hunger"></div></div></div>
                    <div>✨ 청결도 <div class="progress-bar-bg"><div class="progress-bar" id="bar-clean"></div></div></div>
                    <div>😊 재미 <div class="progress-bar-bg"><div class="progress-bar" id="bar-fun"></div></div></div>
                </div>

                <div class="interaction-menu">
                    <button class="action-btn" onclick="app.act('feed')"><i class="fas fa-hamburger"></i>밥주기</button>
                    <button class="action-btn" onclick="app.act('clean')"><i class="fas fa-soap"></i>씻기기</button>
                    <button class="action-btn" onclick="app.act('play')"><i class="fas fa-gamepad"></i>놀기</button>
                </div>
            </section>

            <section id="quest-section" class="hidden-section">
                <h2>오늘의 퀘스트</h2>
                <div id="quest-list"></div>
            </section>

            <section id="feed-section" class="hidden-section">
                <h2>우리 반 갤러리</h2>
                <div id="feed-list"></div>
            </section>
        </main>

        <nav class="bottom-nav">
            <button class="nav-btn active" onclick="app.tab('pet-section', this)"><i class="fas fa-home"></i>홈</button>
            <button class="nav-btn" onclick="app.tab('quest-section', this)"><i class="fas fa-list"></i>퀘스트</button>
            <button class="nav-btn" onclick="app.tab('feed-section', this)"><i class="fas fa-images"></i>피드</button>
        </nav>
    </div>

    <div id="input-modal" class="modal-overlay">
        <div class="modal-content">
            <h2 id="input-title">입력해주세요</h2>
            <p id="input-desc" style="color:#666; margin-bottom:15px; font-size:0.9rem;">설명</p>
            <input type="text" id="custom-input" placeholder="여기에 입력..." style="width:100%; padding:10px; border:1px solid #ddd; border-radius:5px; margin-bottom:15px; font-size:1rem;">
            <button id="input-confirm-btn" class="btn-primary">확인</button>
        </div>
    </div>

    <div id="reward-popup">
        <div class="popup-content">
            <div class="reward-icon">🎁</div>
            <div class="reward-text" id="popup-title">보상 획득!</div>
            <div class="reward-sub" id="popup-desc">내용</div>
            <button class="btn-primary" onclick="document.getElementById('reward-popup').style.display='none'">확인</button>
        </div>
    </div>

    <div id="toast-container"></div>

    <div id="photo-modal" class="modal-overlay">
        <div class="modal-content">
            <h2 id="m-title">퀘스트</h2>
            <p id="m-desc" style="color:#666; margin:10px 0;">설명</p>
            <div style="background:#f5f5f5; padding:20px; border-radius:10px; margin-bottom:10px; cursor:pointer;" onclick="document.getElementById('file-input').click()">
                <i class="fas fa-camera" style="font-size:2rem; color:#ccc;"></i>
                <div style="margin-top:5px; color:#888; font-size:0.9rem;">터치하여 사진찍기</div>
                <img id="preview-img" style="width:100%; display:none; margin-top:10px; border-radius:5px;">
            </div>
            <input type="file" id="file-input" accept="image/*" style="display:none;" onchange="app.file(this)">
            <button id="submit-btn" class="btn-primary" disabled onclick="app.submit()">제출하기</button>
            <button style="margin-top:10px; background:none; border:none; color:#999; cursor:pointer;" onclick="document.getElementById('photo-modal').style.display='none'">닫기</button>
        </div>
    </div>

    <script type="module" src="js/main.js"></script>
</body>
</html>
