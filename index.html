<!DOCTYPE html>
<html lang="ko" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="google" content="notranslate">
    
    <title>다마고치 퀘스트 (1단계: 기초공사)</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        /* --- [CSS 스타일] --- */
        :root { --primary: #FF9F1C; --secondary: #2EC4B6; --bg: #F0F2F5; }
        
        /* 1. 핵심: 터치 씹힘 및 하얀 막대 원천 차단 */
        * {
            box-sizing: border-box; margin: 0; padding: 0; font-family: 'Noto Sans KR', sans-serif;
            
            /* 텍스트/이미지 선택 금지 -> 하얀 막대 안 뜸 */
            -webkit-user-select: none !important; 
            user-select: none !important;
            
            /* 터치 반응 속도 최적화 */
            -webkit-tap-highlight-color: transparent !important;
            touch-action: manipulation;
        }

        body { background: #ddd; display: flex; justify-content: center; height: 100vh; overflow: hidden; }
        
        /* 앱 화면 (규격 고정) */
        .app-container {
            width: 100%; max-width: 420px; height: 100%; background: #F7F9FC;
            position: relative; display: flex; flex-direction: column;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
        }

        /* 헤더 */
        .app-header {
            height: 60px; padding: 0 20px; background: white; z-index: 10;
            display: flex; justify-content: space-between; align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .coin-display { background: #fff8e1; color: #f1c40f; padding: 5px 12px; border-radius: 20px; font-weight: bold; }

        /* 메인 콘텐츠 */
        #main-content { flex: 1; overflow-y: auto; padding: 20px; padding-bottom: 100px; }
        .hidden-section { display: none !important; }
        .active-section { display: block !important; animation: fadeIn 0.3s; }

        /* 펫 표시 영역 */
        .pet-container { text-align: center; margin: 30px 0; min-height: 200px; }
        .pet-character { 
            font-size: 6rem; margin: 20px 0; transition: 0.1s; cursor: pointer; 
            display: inline-block;
        }
        .pet-character:active { transform: scale(0.9); } /* 눌리는 느낌 */
        
        .speech-bubble {
            background: #333; color: white; padding: 10px 15px; border-radius: 15px;
            display: inline-block; position: relative; animation: bounce 2s infinite;
        }

        /* 게이지바 */
        .status-bars { background: white; padding: 20px; border-radius: 15px; margin-bottom: 20px; }
        .progress-bar-bg { background: #eee; height: 10px; border-radius: 5px; overflow: hidden; margin-top:5px; }
        .progress-bar { height: 100%; background: var(--secondary); width: 50%; transition: width 0.3s; }
        
        /* 버튼들 */
        .interaction-menu { display: flex; gap: 10px; }
        .action-btn {
            flex: 1; background: white; border: none; padding: 15px; border-radius: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1); cursor: pointer; display: flex; flex-direction: column; align-items: center;
        }
        .action-btn i { font-size: 1.5rem; color: var(--primary); margin-bottom: 5px; }

        /* 하단 메뉴 (공중부양 & 안전지대 확보) */
        .bottom-nav {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
            width: 90%; max-width: 380px; height: 70px;
            background: rgba(255,255,255,0.95); border-radius: 35px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
            display: flex; justify-content: space-around; align-items: center; z-index: 999;
        }
        .nav-btn { background: none; border: none; color: #ccc; cursor: pointer; flex: 1; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .nav-btn.active { color: var(--secondary); font-weight: bold; }
        .nav-btn i { font-size: 1.4rem; margin-bottom: 3px; }

        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
        @keyframes fadeIn { from { opacity:0; } to { opacity:1; } }
    </style>
</head>
<body>

    <div class="app-container">
        <header class="app-header">
            <span id="user-nickname" style="font-weight:bold;">접속 중...</span>
            <span class="coin-display">💰 <span id="user-coins">0</span></span>
        </header>

        <main id="main-content">
            <section id="pet-section" class="active-section">
                <div class="pet-container">
                    <div class="speech-bubble" id="pet-speech">로딩이 끝나면 말할게!</div>
                    <div class="pet-character" id="pet-character">⏳</div>
                </div>

                <div class="status-bars">
                    <div>😋 배고픔 <div class="progress-bar-bg"><div class="progress-bar" id="bar-hunger"></div></div></div>
                    <div style="margin-top:10px;">✨ 청결도 <div class="progress-bar-bg"><div class="progress-bar" id="bar-clean"></div></div></div>
                    <div style="margin-top:10px;">😊 재미 <div class="progress-bar-bg"><div class="progress-bar" id="bar-fun"></div></div></div>
                </div>

                <div class="interaction-menu">
                    <button class="action-btn" onclick="app.action('feed')"><i class="fas fa-hamburger"></i>밥주기</button>
                    <button class="action-btn" onclick="app.action('clean')"><i class="fas fa-soap"></i>씻기기</button>
                    <button class="action-btn" onclick="app.action('play')"><i class="fas fa-gamepad"></i>놀기</button>
                </div>
            </section>

            <section id="quest-section" class="hidden-section">
                <h2>오늘의 퀘스트</h2>
                <div id="quest-list" style="margin-top:20px;">
                    <div style="background:white; padding:15px; border-radius:10px;">퀘스트 로딩 중...</div>
                </div>
            </section>
        </main>

        <nav class="bottom-nav">
            <button class="nav-btn active" onclick="app.switchTab('pet-section', this)"><i class="fas fa-home"></i>홈</button>
            <button class="nav-btn" onclick="app.switchTab('quest-section', this)"><i class="fas fa-list"></i>퀘스트</button>
        </nav>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, getDoc, setDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // 1. 설정 (사용자님 새 프로젝트 키)
        const firebaseConfig = {
            apiKey: "AIzaSyDvT-74P4tT1q50HSrQaND_4U6wd8k1D-E",
            authDomain: "dama-ec569.firebaseapp.com",
            projectId: "dama-ec569",
            storageBucket: "dama-ec569.firebasestorage.app",
            messagingSenderId: "328651666527",
            appId: "1:328651666527:web:4cccf725a6ef061e2b97ea",
            measurementId: "G-XMVX5EZ1SL"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // 2. 전역 변수 설정
        let currentUser = null;
        // 주소창에 ?id=... 가 없으면 'test_user'로 자동 로그인 (멈춤 방지)
        let userId = new URLSearchParams(window.location.search).get('id');
        if (!userId) userId = "test_user";

        // 3. 앱 기능 모음 (HTML에서 바로 부를 수 있게 window에 등록)
        window.app = {
            // 탭 전환
            switchTab: (targetId, btn) => {
                document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                document.querySelectorAll('section').forEach(s => {
                    if(s.id === targetId) {
                        s.classList.remove('hidden-section');
                        s.classList.add('active-section');
                    } else {
                        s.classList.add('hidden-section');
                        s.classList.remove('active-section');
                    }
                });
            },

            // 행동 (밥주기 등)
            action: async (type) => {
                if (!currentUser) return alert("데이터 로딩 중입니다. 잠시만요!");
                if (currentUser.coins < 10) return alert("코인이 부족해요! (10코인 필요)");

                // 코인 차감 및 스탯 증가
                currentUser.coins -= 10;
                let speechText = "";

                if(type === 'feed') {
                    currentUser.pet.hunger = Math.min(100, currentUser.pet.hunger + 20);
                    speechText = "냠냠! 맛있다!";
                }
                if(type === 'clean') {
                    currentUser.pet.cleanliness = Math.min(100, currentUser.pet.cleanliness + 20);
                    speechText = "아이 개운해!";
                }
                if(type === 'play') {
                    currentUser.pet.fun = Math.min(100, currentUser.pet.fun + 20);
                    speechText = "헤헤 재밌다!";
                }

                // 화면 갱신
                updateUI();
                document.getElementById('pet-speech').innerText = speechText;
                
                // DB 저장 (백그라운드)
                await updateDoc(doc(db, "users", userId), {
                    coins: currentUser.coins,
                    pet: currentUser.pet
                });
            }
        };

        // 4. 초기화 함수 (자동 실행)
        async function init() {
            try {
                const userRef = doc(db, "users", userId);
                const snap = await getDoc(userRef);

                if (snap.exists()) {
                    currentUser = snap.data();
                } else {
                    // 신규 유저 생성
                    currentUser = {
                        nickname: "모험가_" + userId,
                        coins: 100,
                        pet: { hunger: 50, cleanliness: 50, fun: 50, characterId: 'egg' }
                    };
                    await setDoc(userRef, currentUser);
                }
                
                // 로딩 완료 후 UI 그리기
                updateUI(); 
                document.getElementById('pet-character').innerText = "🥚"; // 일단 알 모양

            } catch (error) {
                console.error("에러 발생:", error);
                document.getElementById('pet-speech').innerText = "서버 연결 실패 ㅠㅠ";
            }
        }

        // 5. 화면 갱신 함수
        function updateUI() {
            document.getElementById('user-nickname').innerText = currentUser.nickname;
            document.getElementById('user-coins').innerText = currentUser.coins;
            document.getElementById('pet-speech').innerText = "안녕! 난 준비됐어!";
            
            document.getElementById('bar-hunger').style.width = currentUser.pet.hunger + "%";
            document.getElementById('bar-clean').style.width = currentUser.pet.cleanliness + "%";
            document.getElementById('bar-fun').style.width = currentUser.pet.fun + "%";
        }

        // 실행!
        init();
    </script>
</body>
</html>
