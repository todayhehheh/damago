<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>다마고치 퀘스트</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="app-container">
        <header class="app-header">
            <span id="user-nickname" onclick="app.editName()">로딩중...</span>
            <span class="coin-display">💰 <span id="user-coins">0</span></span>
        </header>

        <main id="main-content">
            <section id="pet-section" class="active-section">
                <div class="pet-container">
                    <div class="speech-bubble" id="pet-speech">안녕! 반가워!</div>
                    <img id="pet-img" src="images/pet_lv1.png" onerror="this.src='https://via.placeholder.com/200'">
                </div>
                <div class="level-info">
                    <span id="level-badge">Lv.1</span>
                    <div class="exp-bar-bg">
                        <div class="exp-bar" id="exp-bar"></div>
                    </div>
                </div>
                <div class="status-bars">
                    <div>😋 배고픔 <div class="progress-bar-bg">
                            <div class="progress-bar" id="bar-hunger"></div>
                        </div>
                    </div>
                    <div>✨ 청결도 <div class="progress-bar-bg">
                            <div class="progress-bar" id="bar-clean"></div>
                        </div>
                    </div>
                    <div>😊 재미 <div class="progress-bar-bg">
                            <div class="progress-bar" id="bar-fun"></div>
                        </div>
                    </div>
                </div>
                <div class="interaction-menu">
                    <button class="action-btn" onclick="app.act('feed')"><i class="fas fa-hamburger"></i>밥주기</button>
                    <button class="action-btn" onclick="app.act('clean')"><i class="fas fa-soap"></i>씻기기</button>
                    <button class="action-btn" onclick="app.act('play')"><i class="fas fa-gamepad"></i>놀기</button>
                </div>
            </section>

            <section id="quest-section">
                <h2>오늘의 퀘스트</h2>
                <div id="quest-list"></div>
            </section>

            <section id="feed-section">
                <h2>우리 반 갤러리</h2>
                <div id="feed-list"></div>
            </section>
        </main>

        <nav class="bottom-nav">
            <button class="nav-btn active" onclick="app.tab('pet-section', this)"><i class="fas fa-home"></i>홈</button>
            <button class="nav-btn" onclick="app.tab('quest-section', this)"><i class="fas fa-list"></i>퀘스트</button>
            <button class="nav-btn" onclick="app.tab('feed-section', this)"><i class="fas fa-images"></i>피드</button>
        </nav>
    </div>

    <div id="toast-container"></div>
    <div id="modal-overlay" class="modal-overlay">
        <div class="modal-content">
            <h2 id="m-title">퀘스트</h2>
            <p id="m-desc">설명</p>
            <div style="background:#f5f5f5; padding:20px; border-radius:10px; cursor:pointer;"
                onclick="document.getElementById('file-input').click()">
                <i class="fas fa-camera"></i> 사진찍기
                <img id="preview-img" style="width:100%; display:none;">
            </div>
            <input type="file" id="file-input" accept="image/*" style="display:none;" onchange="app.file(this)">
            <button id="submit-btn" class="btn-primary" disabled onclick="app.submit()">제출하기</button>
            <button style="margin-top:10px; background:none; border:none;"
                onclick="document.getElementById('modal-overlay').style.display='none'">닫기</button>
        </div>
    </div>

    <script type="module" src="js/main.js"></script>
</body>

</html>
