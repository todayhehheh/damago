<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>다마고치 퀘스트</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* --- 기본 스타일 --- */
        :root { --primary: #FF9F1C; --secondary: #2EC4B6; --bg: #F0F2F5; --heart: #e74c3c; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Noto Sans KR', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: #ddd; display: flex; justify-content: center; height: 100vh; overflow: hidden; margin: 0; }
        .app-container { width: 100%; max-width: 420px; height: 100%; background: #F7F9FC; position: relative; display: flex; flex-direction: column; }

        /* 헤더 */
        .app-header { height: 60px; padding: 0 20px; background: white; z-index: 10; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .coin-display { background: #fff8e1; color: #f1c40f; padding: 5px 12px; border-radius: 20px; font-weight: bold; }

        /* 메인 콘텐츠 & 탭 전환 */
        #main-content { flex: 1; overflow-y: auto; padding: 20px; padding-bottom: 80px; }
        
        /* ★ 탭 전환 핵심 스타일 ★ */
        section { display: none; } /* 기본적으로 다 숨김 */
        section.active-section { display: block; animation: fadeIn 0.3s; } /* 활성화된 것만 보임 */

        /* 펫 영역 */
        .pet-container { text-align: center; margin: 20px 0; }
        #pet-img { width: 200px; height: 200px; object-fit: contain; transition: transform 0.1s; }
        #pet-img:active { transform: scale(0.95); }
        .speech-bubble { background: #333; color: white; padding: 10px; border-radius: 15px; display: inline-block; margin-bottom: 10px; animation: bounce 2s infinite; }

        /* 레벨바 */
        .level-info { display: flex; align-items: center; gap: 10px; margin-bottom: 15px; }
        .exp-bar-bg { flex: 1; height: 10px; background: #ddd; border-radius: 5px; overflow: hidden; }
        .exp-bar { height: 100%; background: linear-gradient(90deg, #FF9F1C, #FFD700); width: 0%; transition: width 0.5s; }

        /* 상태바 & 버튼 */
        .status-bars { background: white; padding: 15px; border-radius: 15px; margin-bottom: 20px; }
        .progress-bar-bg { background: #eee; height: 8px; border-radius: 4px; overflow: hidden; margin-top:5px; margin-bottom: 10px;}
        .progress-bar { height: 100%; background: var(--secondary); width: 50%; }
        .interaction-menu { display: flex; gap: 10px; }
        .action-btn { flex: 1; background: white; border: none; padding: 15px; border-radius: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); cursor: pointer; }
        .action-btn i { font-size: 1.5rem; color: var(--primary); display: block; margin-bottom: 5px; }

        /* 리스트 스타일 */
        .quest-card, .feed-card { background: white; border-radius: 15px; padding: 15px; margin-bottom: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .feed-img { width: 100%; height: 200px; object-fit: cover; border-radius: 10px; margin-top: 10px; background: #eee; }
        .like-btn { border: none; background: none; color: #ccc; font-size: 1.2rem; cursor: pointer; margin-top: 5px; }
        .like-btn.liked { color: var(--heart); }

        /* 하단 메뉴 */
        .bottom-nav { position: fixed; bottom: 0; width: 100%; max-width: 420px; height: 70px; background: white; display: flex; border-top: 1px solid #eee; z-index: 900; }
        .nav-btn { flex: 1; border: none; background: none; color: #ccc; cursor: pointer; font-size: 0.8rem; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .nav-btn.active { color: var(--secondary); font-weight: bold; }
        .nav-btn i { font-size: 1.4rem; margin-bottom: 3px; }

        /* 모달 & 토스트 */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 2000; display: none; justify-content: center; align-items: center; }
        .modal-content { background: white; width: 90%; max-width: 350px; padding: 25px; border-radius: 20px; text-align: center; position: relative; }
        .btn-primary { width: 100%; padding: 12px; background: var(--secondary); color: white; border: none; border-radius: 10px; margin-top: 10px; font-weight: bold; cursor: pointer; }
        .toast-msg { position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.8); color: white; padding: 10px 20px; border-radius: 20px; z-index: 3000; animation: fadeUp 2s forwards; }
        @keyframes fadeUp { 0% { opacity: 0; transform: translate(-50%, 20px); } 20% { opacity: 1; transform: translate(-50%, 0); } 80% { opacity: 1; } 100% { opacity: 0; } }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
        @keyframes fadeIn { from { opacity:0; } to { opacity:1; } }
    </style>
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <span id="user-nickname">로딩중...</span>
            <span class="coin-display">💰 <span id="user-coins">0</span></span>
        </header>

        <main id="main-content">
            <section id="pet-section" class="active-section">
                <div class="pet-container">
                    <div class="speech-bubble" id="pet-speech">안녕! 반가워!</div>
                    <img id="pet-img" src="images/pet_lv1.png" onerror="this.src='https://via.placeholder.com/200?text=Pet'">
                </div>
                <div class="level-info">
                    <span id="level-badge" style="background:#333; color:white; padding:3px 8px; border-radius:10px; font-size:0.8rem;">Lv.1</span>
                    <div class="exp-bar-bg"><div class="exp-bar" id="exp-bar"></div></div>
                </div>
                <div class="status-bars">
                    <div>😋 배고픔 <div class="progress-bar-bg"><div class="progress-bar" id="bar-hunger"></div></div></div>
                    <div>✨ 청결도 <div class="progress-bar-bg"><div class="progress-bar" id="bar-clean"></div></div></div>
                    <div>😊 재미 <div class="progress-bar-bg"><div class="progress-bar" id="bar-fun"></div></div></div>
                </div>
                <div class="interaction-menu">
                    <button class="action-btn" onclick="app.act('feed')"><i class="fas fa-hamburger"></i>밥주기</button>
                    <button class="action-btn" onclick="app.act('clean')"><i class="fas fa-soap"></i>씻기기</button>
                    <button class="action-btn" onclick="app.act('play')"><i class="fas fa-gamepad"></i>놀기</button>
                </div>
            </section>

            <section id="quest-section">
                <h2>오늘의 퀘스트</h2>
                <div id="quest-list"></div>
            </section>

            <section id="feed-section">
                <h2>우리 반 갤러리</h2>
                <div id="feed-list"></div>
            </section>
        </main>

        <nav class="bottom-nav">
            <button class="nav-btn active" onclick="app.tab('pet-section', this)"><i class="fas fa-home"></i>홈</button>
            <button class="nav-btn" onclick="app.tab('quest-section', this)"><i class="fas fa-list"></i>퀘스트</button>
            <button class="nav-btn" onclick="app.tab('feed-section', this)"><i class="fas fa-images"></i>피드</button>
        </nav>
    </div>

    <div id="toast-box"></div>
    <div id="modal-overlay" class="modal-overlay">
        <div class="modal-content">
            <h2 id="m-title">퀘스트</h2>
            <p id="m-desc" style="color:#666; margin:10px 0;">설명</p>
            <div style="background:#f5f5f5; padding:20px; border-radius:10px; margin-bottom:10px;" onclick="document.getElementById('file-input').click()">
                <i class="fas fa-camera" style="font-size:2rem; color:#ccc;"></i>
                <img id="preview-img" style="width:100%; display:none; margin-top:10px; border-radius:5px;">
            </div>
            <input type="file" id="file-input" accept="image/*" style="display:none;" onchange="app.file(this)">
            <button id="submit-btn" class="btn-primary" disabled onclick="app.submit()">제출하기</button>
            <button style="margin-top:10px; background:none; border:none; color:#999; cursor:pointer;" onclick="document.getElementById('modal-overlay').style.display='none'">닫기</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, getDoc, setDoc, updateDoc, collection, addDoc, onSnapshot, query, arrayUnion, arrayRemove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // ★ 설정: 여기에 본인의 Firebase 키를 넣으세요 (지금은 예시 키입니다) ★
        const config = { apiKey: "AIzaSyDvT-74P4tT1q50HSrQaND_4U6wd8k1D-E", authDomain: "dama-ec569.firebaseapp.com", projectId: "dama-ec569", storageBucket: "dama-ec569.firebasestorage.app", messagingSenderId: "328651666527", appId: "1:328651666527:web:4cccf725a6ef061e2b97ea", measurementId: "G-XMVX5EZ1SL" };
        
        let db, user, curQId, upImg;
        
        try {
            const app = initializeApp(config);
            db = getFirestore(app);
        } catch(e) {
            alert("Firebase 연결 오류: " + e.message);
        }

        const uid = new URLSearchParams(window.location.search).get('id') || "test_user";
        const DAILY = [
            { id: 'd_pic', title: '📷 오늘의 인증샷', desc: '오늘 활동 사진 올리기', reward: 50, type: '일일' },
            { id: 'd_like', title: '❤️ 친구 칭찬하기', desc: '좋아요 3회 누르기', reward: 30, type: '일일' }
        ];

        window.app = {
            // 탭 전환 (강력하게 수정됨)
            tab: (id, btn) => {
                document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                document.querySelectorAll('section').forEach(s => {
                    s.classList.remove('active-section'); // 일단 다 끔
                    if(s.id === id) s.classList.add('active-section'); // 선택한 것만 켬
                });
            },
            // 행동
            act: async (type) => {
                if(!user) return;
                if(user.coins < 10) return toast("코인이 부족해요!");
                if(type=='feed' && user.pet.hunger>=100) return speech("배불러요!");
                
                user.coins -= 10;
                addExp(5);
                if(type=='feed') user.pet.hunger = Math.min(100, user.pet.hunger+20);
                if(type=='clean') user.pet.cleanliness = Math.min(100, user.pet.cleanliness+20);
                if(type=='play') user.pet.fun = Math.min(100, user.pet.fun+20);
                
                render();
                speech(type=='feed'?"냠냠!": (type=='clean'?"개운해!":"신난다!"));
                save();
            },
            // 모달 열기
            modal: (id, t, d) => {
                curQId = id; upImg = null;
                document.getElementById('m-title').innerText = t;
                document.getElementById('m-desc').innerText = d;
                document.getElementById('preview-img').style.display = 'none';
                document.getElementById('submit-btn').disabled = true;
                document.getElementById('modal-overlay').style.display = 'flex';
            },
            // 파일 선택
            file: (inp) => {
                if(inp.files[0]) {
                    const r = new FileReader();
                    r.onload = (e) => {
                        upImg = e.target.result; // 실제 앱에선 리사이징 필요
                        document.getElementById('preview-img').src = upImg;
                        document.getElementById('preview-img').style.display = 'block';
                        document.getElementById('submit-btn').disabled = false;
                    }
                    r.readAsDataURL(inp.files[0]);
                }
            },
            // 제출
            submit: async () => {
                user.log[curQId] = { done: true, claimed: false };
                if(upImg) await addDoc(collection(db, "posts"), { uid, nick: user.nick, title: "퀘스트 인증", img: upImg, likes: [], date: Date.now() });
                document.getElementById('modal-overlay').style.display = 'none';
                toast("제출 완료! 보상을 받으세요.");
                save();
            },
            // 보상 받기
            claim: async (id, r) => {
                user.coins += r;
                user.log[id].claimed = true;
                addExp(20);
                toast(`${r}코인 획득!`);
                save();
            },
            // 좋아요
            like: async (pid, likes) => {
                const ref = doc(db, "posts", pid);
                if(!likes.includes(uid)) {
                    await updateDoc(ref, { likes: arrayUnion(uid) });
                    if(!user.log['d_like']) user.log['d_like'] = { count: 0 };
                    user.log['d_like'].count = (user.log['d_like'].count||0) + 1;
                    if(user.log['d_like'].count >= 3) {
                        user.log['d_like'].done = true;
                        toast("좋아요 미션 완료!");
                    }
                    save();
                } else {
                    await updateDoc(ref, { likes: arrayRemove(uid) });
                }
            }
        };

        function speech(t) { document.getElementById('pet-speech').innerText = t; }
        function toast(m) {
            const d = document.createElement('div');
            d.className = 'toast-msg'; d.innerText = m;
            document.body.appendChild(d);
            setTimeout(()=>d.remove(), 2000);
        }
        function addExp(n) {
            user.pet.exp += n;
            if(user.pet.exp >= 100) { user.pet.exp=0; user.pet.lv++; toast(`레벨 ${user.pet.lv} 달성!`); }
        }
        async function save() { await updateDoc(doc(db, "users", uid), { coins: user.coins, pet: user.pet, log: user.log }); render(); }

        // ★ 초기화 함수 (에러 처리 포함) ★
        async function init() {
            // 로딩 타임아웃 (5초 뒤에도 로딩이면 에러 표시)
            setTimeout(() => {
                if(document.getElementById('user-nickname').innerText === "로딩중...") {
                    document.getElementById('pet-speech').innerText = "연결이 너무 느려요 ㅠㅠ\n새로고침 해주세요.";
                }
            }, 5000);

            try {
                const snap = await getDoc(doc(db, "users", uid));
                const today = new Date().toDateString();
                
                if(snap.exists()) {
                    user = snap.data();
                    if(user.lastLogin !== today) {
                        user.log = { ...user.log, d_pic: {done:false}, d_like: {count:0} }; // 데일리 초기화
                        user.lastLogin = today;
                        save();
                    }
                } else {
                    user = { nick: "모험가_"+uid.substr(0,4), coins: 100, pet: { hunger:50, cleanliness:50, fun:50, lv:1, exp:0 }, log: {}, lastLogin: today };
                    await setDoc(doc(db, "users", uid), user);
                }
                render();

                // 퀘스트 실시간 로딩
                onSnapshot(collection(db, "quests"), (qs) => {
                    const list = document.getElementById('quest-list');
                    list.innerHTML = "";
                    const todayDate = new Date().toDateString();
                    
                    // 데일리 + DB 퀘스트 병합
                    const allQ = [...DAILY];
                    qs.forEach(d => {
                        const q = d.data();
                        if(q.type === '일일' && q.dateString !== todayDate) return;
                        allQ.push({ id: d.id, ...q });
                    });

                    allQ.forEach(q => {
                        const l = user.log[q.id] || {};
                        if(l.claimed) return; // 이미 받음

                        const d = document.createElement('div');
                        d.className = 'quest-card';
                        if(l.done) {
                            d.innerHTML = `<b>${q.title}</b> <button class="btn-primary" style="width:auto; margin:0; padding:5px 10px;" onclick="app.claim('${q.id}', ${q.reward})">보상 받기</button>`;
                        } else {
                            const prog = q.id==='d_like' ? `(${l.count||0}/3)` : '';
                            d.innerHTML = `<span style="background:${q.type=='일일'?'#E3F2FD':'#FFF3E0'}; font-size:0.8rem; padding:2px 5px; border-radius:5px;">${q.type}</span> <b>${q.title}</b> ${prog} <span style="float:right; color:#f1c40f">💰${q.reward}</span>`;
                            if(q.id==='d_like') d.onclick = () => toast("피드에서 좋아요를 누르세요!");
                            else d.onclick = () => app.modal(q.id, q.title, q.desc);
                        }
                        list.appendChild(d);
                    });
                });

                // 피드 로딩
                onSnapshot(collection(db, "posts"), (ps) => {
                    const list = document.getElementById('feed-list');
                    list.innerHTML = "";
                    const arr = [];
                    ps.forEach(d => arr.push({id:d.id, ...d.data()}));
                    arr.sort((a,b)=>b.date-a.date).forEach(p => {
                        const liked = p.likes && p.likes.includes(uid);
                        list.innerHTML += `<div class="feed-card"><div><b>${p.nick}</b></div><img src="${p.img}" class="feed-img"><div><button class="like-btn ${liked?'liked':''}" onclick="app.like('${p.id}', [${(p.likes||[]).map(x=>`'${x}'`)}])">❤️ ${p.likes?p.likes.length:0}</button></div></div>`;
                    });
                });

            } catch(e) {
                alert("초기화 오류: " + e.message);
            }
        }

        function render() {
            document.getElementById('user-nickname').innerText = user.nick;
            document.getElementById('user-coins').innerText = user.coins;
            document.getElementById('bar-hunger').style.width = user.pet.hunger+"%";
            document.getElementById('bar-clean').style.width = user.pet.cleanliness+"%";
            document.getElementById('bar-fun').style.width = user.pet.fun+"%";
            document.getElementById('exp-bar').style.width = user.pet.exp+"%";
            
            const img = document.getElementById('pet-img');
            img.src = user.pet.lv===1 ? "images/pet_lv1.png" : (user.pet.lv===2 ? "images/pet_lv2.png" : "images/pet_lv3.png");
        }

        init();
    </script>
</body>
</html>
