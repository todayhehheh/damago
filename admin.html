<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>관리자 페이지</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background: #f0f2f5; font-family: 'Noto Sans KR', sans-serif; padding: 20px; max-width: 800px; margin: 0 auto; }
        .card { background: white; padding: 20px; border-radius: 10px; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        input, select { padding: 10px; width: 100%; margin-bottom: 10px; border: 1px solid #ddd; border-radius: 5px; }
        button { padding: 10px 20px; background: #2EC4B6; color: white; border: none; border-radius: 5px; cursor: pointer; }
        .del-btn { background: #e74c3c; float: right; }
    </style>
</head>
<body>
    <h1>⚙️ 선생님 관리 페이지</h1>
    
    <div class="card">
        <h3>📝 퀘스트 추가</h3>
        <select id="q-type"><option value="일일">일일 미션 (내일 사라짐)</option><option value="특별">특별 미션 (계속 유지)</option></select>
        <input id="q-title" placeholder="제목 (예: 수학익힘책 20p)">
        <input id="q-desc" placeholder="설명 (예: 풀고나서 인증샷)">
        <input id="q-reward" type="number" placeholder="보상 코인">
        <button onclick="addQ()">등록하기</button>
    </div>

    <div class="card">
        <h3>📋 퀘스트 목록</h3>
        <div id="q-list"></div>
    </div>

    <div class="card">
        <h3>📸 피드 관리</h3>
        <div id="f-list"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, deleteDoc, doc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // ★ 설정: 여기에 Firebase 키를 넣으세요 ★
        const config = { apiKey: "AIzaSyDvT-74P4tT1q50HSrQaND_4U6wd8k1D-E", authDomain: "dama-ec569.firebaseapp.com", projectId: "dama-ec569", storageBucket: "dama-ec569.firebasestorage.app", messagingSenderId: "328651666527", appId: "1:328651666527:web:4cccf725a6ef061e2b97ea", measurementId: "G-XMVX5EZ1SL" };
        const db = getFirestore(initializeApp(config));

        window.addQ = async () => {
            const type = document.getElementById('q-type').value;
            const title = document.getElementById('q-title').value;
            const desc = document.getElementById('q-desc').value;
            const reward = Number(document.getElementById('q-reward').value);
            if(!title) return alert("제목 입력!");
            
            await addDoc(collection(db, "quests"), { type, title, desc, reward, createdAt: Date.now(), dateString: new Date().toDateString() });
            alert("등록 완료");
            document.getElementById('q-title').value = "";
        };

        window.del = async (col, id) => {
            if(confirm("정말 삭제합니까?")) await deleteDoc(doc(db, col, id));
        };

        // 목록 로딩
        onSnapshot(query(collection(db, "quests"), orderBy("createdAt", "desc")), snap => {
            document.getElementById('q-list').innerHTML = "";
            snap.forEach(d => {
                const q = d.data();
                document.getElementById('q-list').innerHTML += `<div style="border-bottom:1px solid #eee; padding:10px;">[${q.type}] <b>${q.title}</b> (${q.reward}코인) <button class="del-btn" onclick="del('quests','${d.id}')">삭제</button></div>`;
            });
        });

        onSnapshot(query(collection(db, "posts"), orderBy("date", "desc")), snap => {
            document.getElementById('f-list').innerHTML = "";
            snap.forEach(d => {
                const p = d.data();
                document.getElementById('f-list').innerHTML += `<div style="border-bottom:1px solid #eee; padding:10px;"><img src="${p.img}" style="width:50px; vertical-align:middle"> <b>${p.nick}</b>: ${p.title} <button class="del-btn" onclick="del('posts','${d.id}')">삭제</button></div>`;
            });
        });
    </script>
</body>
</html>
